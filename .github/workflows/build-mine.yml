# Personal build. Replicates the inputs of the last klotz Build Inputs run,
# 2026-02-05 (run 21694465012), so they don't have to be retyped:
#
#   board: nice_nano
#   shield: klotz_left
#   everything else: default
#
name: 'Build Mine'
on: workflow_dispatch
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano"]'
      shield: '["klotz_left"]'
